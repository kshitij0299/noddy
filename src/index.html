	<head>
		<meta charset="utf-8" />
		<title>Noddy</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="./common/graphics/noddy-icon.svg" type="image/svg+xml" />
		<link rel="icon" href="./common/graphics/noddy-icon-bg.svg" type="image/svg+xml" />
		<link rel="shortcut icon" href="./common/graphics/logo-icon-color.ico" />
		<link rel="manifest" href="manifest.json" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<script src="app/main.js" type="module"></script>
		<script type="module">
			import { glyphrStudioOnLoad, getGlyphrStudioApp, log } from './app/main.js';
			window.log = log;
			document.addEventListener('DOMContentLoaded', glyphrStudioOnLoad);
			window._GlyphrStudioApp = getGlyphrStudioApp();
		</script>
		<style>
			/* Inline shell — kept minimal; core tokens live in colors.css + resets.css */
			:root {
				--dark-gradient-background: linear-gradient(
					135deg,
					oklch(0.1979 0.0107 39.2759) 0%,
					oklch(0.175 0.015 48.5) 45%,
					oklch(0.145 0.018 58.15) 100%
				);
			}

			body,
			#app__wrapper,
			#app__landing-page {
				height: 100%;
				width: 100%;
				min-height: 100%;
				min-width: 100%;
				position: absolute;
				inset: 0;
				overflow: hidden;
			}

			body {
				background: var(--dark-gradient-background);
				color: var(--foreground);
				font-family: var(--font-sans);
			}

			#app__wrapper {
				background-color: var(--background);
			}

			/* Landing — chat-app splash, warm peach */
			#app__landing-page {
				font-family: var(--font-sans);
				opacity: 1;
				visibility: visible;
				transition: opacity 420ms ease-out;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				background: var(--dark-gradient-background);
				background-image:
					radial-gradient(720px 520px at 22% 18%, color-mix(in oklch, var(--primary) 18%, transparent), transparent 62%),
					radial-gradient(560px 440px at 88% 86%, color-mix(in oklch, var(--primary) 12%, transparent), transparent 60%),
					var(--dark-gradient-background);
				text-align: center;
			}

			.landing-card {
				width: 100%;
				max-width: 560px;
				background: color-mix(in oklch, var(--card) 96%, transparent);
				border: 1px solid color-mix(in oklch, var(--border) 65%, transparent);
				border-radius: calc(var(--radius) * 1.6);
				box-shadow: 0 24px 48px oklch(0 0 0 / 0.28), 0 8px 16px oklch(0 0 0 / 0.18), 0 0 0 1px color-mix(in oklch, var(--primary) 10%, transparent);
				padding: 36px 32px 28px;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 16px;
				position: relative;
				overflow: hidden;
			}
			.landing-card::before {
				content: '';
				position: absolute;
				inset: 0 0 auto 0;
				height: 3px;
				background: linear-gradient(90deg, var(--primary), oklch(0.78 0.11 58.15), var(--primary));
				opacity: 0.95;
			}
			.landing-card::after {
				content: '';
				position: absolute;
				inset: -60px;
				background: radial-gradient(420px 280px at 50% 0%, color-mix(in oklch, var(--primary) 08%, transparent), transparent 70%);
				pointer-events: none;
			}
			.landing-card > * { position: relative; z-index: 1; }

			/* Big Noddy logo — uses provided noddy-logo-big.svg, themed via wrapper */
			.mainLogo {
				width: min(100%, 420px);
				height: auto;
				display: block;
				filter: drop-shadow(0 1px 0 color-mix(in oklch, var(--primary) 22%, white)) drop-shadow(0 6px 14px oklch(0 0 0 / 0.22));
				border-radius: calc(var(--radius) * 0.9);
			}
			.mainLogo--img {
				width: min(100%, 420px);
				height: auto;
				display: block;
				object-fit: contain;
				filter: drop-shadow(0 1px 0 color-mix(in oklch, var(--primary) 18%, white));
				border-radius: 8px;
			}
			/* Fallback textual wordmark when image fails — rounded display (ROND 60) */
			.landing-wordmark {
				font-family: var(--font-serif);
				font-weight: 700;
				font-variation-settings: 'ROND' 60;
				font-optical-sizing: auto;
				font-size: clamp(36px, 9vw, 52px);
				letter-spacing: var(--tracking-tighter);
				line-height: 0.95;
				color: var(--foreground);
				margin: 2px 0 0;
			}
			.landing-wordmark span {
				color: var(--primary);
			}
			.landing-tagline {
				font-size: 13px;
				font-weight: 500;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--muted-foreground);
				margin-top: -4px;
			}
			.landing-sub {
				font-size: 13.5px;
				line-height: 1.6;
				color: var(--muted-foreground);
				max-width: 38ch;
				margin: 4px 0 0;
			}
			.landing-dots {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-top: 6px;
			}
			.landing-dots i {
				width: 7px;
				height: 7px;
				border-radius: 999px;
				background: var(--border);
				display: block;
				animation: landingPulse 1.4s infinite ease-in-out;
			}
			.landing-dots i:nth-child(1) { background: var(--primary); animation-delay: 0s; }
			.landing-dots i:nth-child(2) { animation-delay: 0.18s; }
			.landing-dots i:nth-child(3) { animation-delay: 0.36s; }
			@keyframes landingPulse {
				0%, 80%, 100% { opacity: 0.45; transform: scale(0.92); }
				40% { opacity: 1; transform: scale(1); }
			}

			.error-page__wrapper {
				margin: auto;
				font-size: 15px;
				text-align: center;
				color: var(--foreground);
				max-width: 520px;
			}
			.error-page__table-flip {
				font-size: 34px;
				opacity: 0.9;
				font-weight: 700;
				font-variation-settings: 'ROND' 60;
				font-optical-sizing: auto;
				padding-bottom: 16px;
				text-align: center;
				color: var(--primary);
				text-shadow: var(--shadow-sm);
				letter-spacing: var(--tracking-tighter);
				font-family: var(--font-serif);
			}
			.error-page__wrapper h1 {
				text-align: center;
				color: var(--foreground);
				font-family: var(--font-serif);
				font-variation-settings: 'ROND' 60;
				font-optical-sizing: auto;
				font-weight: 700;
				font-size: 1.45em;
			}
			.error-page__wrapper a {
				color: var(--primary);
				text-decoration: underline;
				text-underline-offset: 3px;
			}
			.error-page__wrapper pre {
				border: 1px solid var(--border);
				background: var(--muted);
				border-radius: var(--radius);
				text-align: left;
				font-family: var(--font-mono);
				padding: 12px;
				width: 100%;
				user-select: text;
				color: var(--foreground);
				overflow-x: auto;
				font-size: 12px;
				line-height: 1.5;
			}

			@media (max-width: 560px) {
				.landing-card { padding: 28px 18px 22px; border-radius: calc(var(--radius) * 1.2); }
				.mainLogo, .mainLogo--img { width: min(100%, 320px); }
			}
			@media (prefers-reduced-motion: reduce) {
				.landing-dots i { animation: none; }
			}
		</style>
		<!-- Token order matters: colors.css defines variables, resets.css consumes them, app.css builds layout -->
		<link rel="stylesheet" type="text/css" href="./common/colors.css" />
		<link rel="stylesheet" type="text/css" href="./common/resets.css" />
		<link rel="stylesheet" type="text/css" href="./app/app.css" />
		<link rel="stylesheet" type="text/css" href="./controls/dialogs/dialogs.css" />
		<link rel="stylesheet" type="text/css" href="./controls/fancy-slider/fancy-slider.css" />
		<link rel="stylesheet" type="text/css" href="./controls/tabs/tab-control.css" />
		<link
			rel="stylesheet"
			type="text/css"
			href="./controls/progress-indicator/progress-indicator.css"
		/>
		<link rel="stylesheet" type="text/css" href="./project_editor/nav.css" />
		<link rel="stylesheet" type="text/css" href="./pages/editor-pages.css" />
		<link rel="stylesheet" type="text/css" href="./pages/content-pages.css" />
		<link rel="stylesheet" type="text/css" href="./app/app-pages.css" />
		<link rel="stylesheet" type="text/css" href="./panels/panels.css" />
	</head>

	<body
		style="
			background: var(--dark-gradient-background);
			width: 100%;
			height: 100%;
			min-width: 100%;
			min-height: 100%;
			margin: 0;
			padding: 0;
		"
	>
		<div id="app__landing-page">
			<div class="landing-card" role="status" aria-live="polite" aria-label="Loading Noddy">
				<!-- Noddy big logo — warm peach themed; falls back to serif wordmark if image missing -->
				<img
					class="mainLogo mainLogo--img"
					src="./common/graphics/noddy-logo-big.svg"
					alt="Noddy — font editor"
					width="420"
					height="178"
					decoding="async"
					onerror="this.style.display='none'; document.getElementById('landingWordmark').style.display='block';"
				/>
				<div id="landingWordmark" class="landing-wordmark" style="display: none">Nodd<span>y</span></div>
				<div class="landing-tagline">Font editor — warm, precise, yours</div>
				<p class="landing-sub">Craft type like a conversation. Every glyph, kern, and preview lives in one calm canvas.</p>
				<div class="landing-dots" aria-hidden="true"><i></i><i></i><i></i></div>
			</div>

			<script>
				setTimeout(function () {
					let errorDiv = document.querySelector('#errorMessage');
					if (errorDiv && errorDiv.style.display === 'none') {
						// Only show error if app hasn't replaced landing page
						if (document.querySelector('#app__landing-page .landing-card')) {
							errorDiv.style.display = 'block';
							let card = document.querySelector('.landing-card');
							if (card) card.style.display = 'none';
						}
					}
				}, 5000);
			</script>

			<div id="errorMessage" style="display: none; width: min(100%, 420px); margin: 0 auto">
				<div
					style="font-size: 64px; padding-bottom: 16px; text-align: center; color: var(--primary)"
				>
					¯\_(ツ)_/¯
				</div>

				<div
					style="margin: auto; font-size: 15px; text-align: center; color: var(--foreground); background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-md);"
				>
					It looks like Noddy failed to load. Bummer.
					<br />
					Try using the latest version of FireFox, Edge, or Chrome.
					<br /><br />
					Or, send us an email:
					<a
						style="color: var(--primary); text-decoration: underline; text-underline-offset: 3px"
						href="mailto:mail@glyphrstudio.com?subject=Noddy%20Howdy"
						>mail@glyphrstudio.com</a
					>
				</div>
			</div>
		</div>

		<div id="app__wrapper"></div>
	</body>
</html>
