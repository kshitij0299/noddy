<title>Noddy Galley</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffad6c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400..700&family=Google+Sans+Flex:opsz,wght,ROND@6..144,1..1000,0..100&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<style>
/* Layout: header 48 · spec line 40 · centre (proof band over the set grid box, the editor opens in that same box) · agent pane docked right. */
:root {
  --background: oklch(1 0 0);
  --foreground: oklch(0.2707 0.054 44.1725);
  --card: oklch(1 0 0);
  --primary: oklch(0.8141 0.1261 58.1544);
  --primary-foreground: oklch(0.2707 0.054 44.1725);
  /* hover for primary fills: a slightly deeper peach, so dark text stays readable in both themes */
  --primary-hover: color-mix(in oklch, var(--primary) 86%, black);
  --secondary: oklch(0.9584 0.006 43.3348);
  --muted: oklch(0.9702 0 0);
  --muted-foreground: oklch(0.5931 0.0295 44.5478);
  --border: oklch(0.9055 0.0111 54.4854);
  --ring: oklch(0.8141 0.1261 58.1544);
  --destructive: oklch(0.6137 0.2039 25.5645);
  /* proposed, not in the repo yet */
  --success: oklch(0.52 0.13 150);
  --warning: oklch(0.84 0.15 90);
  /* glyph surfaces: the edit canvas stays white for contrast */
  --canvas: oklch(1 0 0);
  --canvas-ink: oklch(0.2707 0.054 44.1725);
  --canvas-guide: oklch(0.9055 0.0111 54.4854);
  --canvas-guide-strong: oklch(0.78 0.03 50);
  --ink: var(--foreground);
  --ghost: oklch(0.80 0.02 50);
  --peach-soft: color-mix(in oklch, var(--primary) 26%, var(--card));
  --peach-faint: color-mix(in oklch, var(--primary) 12%, var(--card));
  --danger-soft: color-mix(in oklch, var(--destructive) 10%, var(--card));
  --success-soft: color-mix(in oklch, var(--success) 12%, var(--card));
  --warning-soft: color-mix(in oklch, var(--warning) 35%, var(--card));
  --scrim: oklch(0.2707 0.054 44.1725 / 0.18);
  --radius: 0.45rem;
  --radius-sm: calc(var(--radius) * 0.6);
  --radius-full: 999px;
  --tracking-normal: 0em;
  --tracking-tight: calc(var(--tracking-normal) - 0.025em);
  --shadow-xs: 0px 4px 10px 0px hsl(0 0% 0% / 0.03);
  --shadow-sm: 0px 4px 10px 0px hsl(0 0% 0% / 0.06), 0px 1px 2px -1px hsl(0 0% 0% / 0.06);
  --shadow-md: 0px 4px 10px 0px hsl(0 0% 0% / 0.06), 0px 2px 4px -1px hsl(0 0% 0% / 0.06);
  --shadow-pane: 0 12px 40px #3c1d0f25;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px;
  --font-sans: 'Google Sans Flex', 'FiraGo', system-ui, sans-serif;
  --font-serif: 'Google Sans Flex', 'FiraGo', system-ui, sans-serif;
  --font-mono: 'Google Sans Code', 'FiraGo', ui-monospace, monospace;
  --hdr-h: 48px;
  --spec-h: 40px;
  --proof-h: 184px;
  --pane-w: clamp(340px, 28vw, 420px);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: oklch(0.1979 0.0107 39.2759);
    --foreground: oklch(0.9799 0.0076 48.6561);
    --card: oklch(0.1979 0.0107 39.2759);
    --secondary: oklch(0.2404 0.0153 39.2562);
    --muted: oklch(0.2572 0.015 39.2662);
    --muted-foreground: oklch(0.6848 0.0223 48.3765);
    --border: oklch(0.2404 0.0153 39.2562);
    --destructive: oklch(0.6884 0.2009 24.0561);
    --success: oklch(0.72 0.15 150);
    --ghost: oklch(0.45 0.02 45);
    --scrim: oklch(0 0 0 / 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --background: oklch(0.1979 0.0107 39.2759);
  --foreground: oklch(0.9799 0.0076 48.6561);
  --card: oklch(0.1979 0.0107 39.2759);
  --secondary: oklch(0.2404 0.0153 39.2562);
  --muted: oklch(0.2572 0.015 39.2662);
  --muted-foreground: oklch(0.6848 0.0223 48.3765);
  --border: oklch(0.2404 0.0153 39.2562);
  --destructive: oklch(0.6884 0.2009 24.0561);
  --success: oklch(0.72 0.15 150);
  --ghost: oklch(0.45 0.02 45);
  --scrim: oklch(0 0 0 / 0.4);
  color-scheme: dark;
}
@media (max-height: 700px) { :root { --proof-h: 148px; } }
@media (max-width: 759px) { :root { --proof-h: 132px; } }

/* ---------- base ---------- */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--secondary); color: var(--foreground);
  font-family: var(--font-sans); font-size: 14px; line-height: 1.4;
  font-optical-sizing: auto; letter-spacing: var(--tracking-normal);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--font-serif); font-weight: 700; font-variation-settings: 'ROND' 60; letter-spacing: var(--tracking-tight); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 1.75rem + 0.8vw, 2.25rem); line-height: 1.15; }
h2 { font-size: 1.5rem; line-height: 1.25; }
h3 { font-size: 1.25rem; line-height: 1.3; }
h4 { font-size: 1rem; font-weight: 600; line-height: 1.4; letter-spacing: var(--tracking-tight); margin: 0; }
p { font-size: 0.875rem; line-height: 1.6; margin: 0; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1, 'liga' 0, 'calt' 0; }
.meta { font-size: 0.6875rem; font-weight: 600; line-height: 1.2; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted-foreground); }
.muted { color: var(--muted-foreground); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible, .force-focus { outline: 2px solid var(--ring); outline-offset: 2px; }
.ms {
  font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1;
  letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr;
  font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased;
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  display: inline-block; width: 1em; height: 1em; overflow: hidden; flex: none; user-select: none;
}
.ms--sm { font-size: 16px; } .ms--xs { font-size: 14px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 32px; min-width: 40px; padding: 4px 12px; box-sizing: border-box;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
  font-size: 0.8125rem; font-weight: 500; line-height: 1.2; letter-spacing: 0.01em; white-space: nowrap;
  transition: background-color 80ms ease, color 80ms ease, border-color 80ms ease;
}
.btn:hover { background: var(--secondary); }
.btn--primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.btn--primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn--minimal { background: transparent; border-color: transparent; }
.btn--minimal:hover { background: var(--secondary); }
.btn--danger { color: var(--destructive); border-color: var(--destructive); background: var(--card); }
.btn--danger:hover { background: var(--danger-soft); }
.btn--sm { min-height: 28px; padding: 2px 10px; font-size: 0.75rem; }
.btn--fill { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { background: var(--muted); color: var(--muted-foreground); border-color: var(--border); cursor: not-allowed; }
.btn.w72 { width: 72px; padding-inline: 4px; } .btn.w88 { width: 88px; padding-inline: 4px; } .btn.w104 { width: 104px; padding-inline: 4px; }
.btn.w120 { width: 120px; padding-inline: 4px; } .btn.w140 { width: 140px; padding-inline: 4px; } .btn.w160 { width: 160px; padding-inline: 4px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 32px; height: 32px; flex: none; padding: 0;
  border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: var(--foreground);
  transition: background-color 80ms ease, color 80ms ease, border-color 80ms ease;
}
.icon-btn:hover { background: var(--secondary); }
.icon-btn[disabled] { color: var(--muted-foreground); cursor: not-allowed; background: transparent; }
.icon-btn--bordered { border-color: var(--border); background: var(--card); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; box-sizing: border-box;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card);
  font-size: 0.8125rem; font-weight: 500; white-space: nowrap;
  transition: background-color 80ms ease, color 80ms ease, border-color 80ms ease;
}
button.chip:hover { background: var(--secondary); }
.chip[aria-pressed="true"], .chip[aria-checked="true"], button.chip[aria-pressed="true"]:hover, button.chip[aria-checked="true"]:hover { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.chip .cnt { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.75rem; min-width: 3ch; text-align: right; color: inherit; opacity: 0.8; }
.input {
  height: 24px; box-sizing: border-box; padding: 0 6px; border: 1px solid var(--border); border-radius: 4px;
  background: var(--card); font-family: var(--font-mono); font-size: 0.8125rem; font-variant-numeric: tabular-nums;
}
.input--32 { height: 32px; border-radius: var(--radius-sm); padding: 0 8px; }
.input--text { font-family: var(--font-sans); }
.input[readonly] { background: var(--muted); color: var(--muted-foreground); }
.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--secondary); border-radius: var(--radius-full); flex: none; }
.tab {
  min-height: 28px; padding: 4px 14px; border: 0; border-radius: var(--radius-full); background: transparent;
  font-size: 0.8125rem; font-weight: 500; white-space: nowrap; color: var(--foreground);
  transition: background-color 80ms ease, color 80ms ease;
}
.tab:hover { color: var(--muted-foreground); }
.tab[aria-selected="true"], .tab[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); }
.tab[aria-selected="true"]:hover { color: var(--primary-foreground); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-xs); }
.label { font-size: 0.8125rem; font-weight: 500; line-height: 1.5; letter-spacing: 0.01em; }
.badge {
  display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 6px; box-sizing: border-box;
  border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 0.6875rem; font-weight: 600; white-space: nowrap; color: var(--foreground);
}
.badge--off { color: var(--muted-foreground); border-style: dashed; font-weight: 500; }
.badge--peach { background: var(--peach-soft); border-color: var(--primary); }

/* status words (one set everywhere) */
.st {
  display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 5px 0 3px; box-sizing: border-box;
  border-radius: var(--radius-sm); border: 1px solid transparent;
  font-size: 0.6875rem; font-weight: 600; line-height: 1; white-space: nowrap; color: var(--foreground);
}
.st .ms { font-size: 14px; }
.st--Empty { color: var(--muted-foreground); border: 1px dashed var(--ghost); }
.st--Queued { color: var(--muted-foreground); background: var(--secondary); }
.st--Drafting { background: var(--peach-faint); border-color: var(--primary); border-style: dashed; }
.st--Draft { background: var(--peach-soft); color: var(--foreground); }
.st--Kept { color: var(--success); background: var(--success-soft); }
.st--Yours { background: var(--secondary); border-color: var(--foreground); }
.st--Held { color: var(--muted-foreground); background: var(--muted); border-color: var(--muted-foreground); }
.st--Failed { color: var(--destructive); background: var(--danger-soft); border-color: var(--destructive); }
html.greyscale #app { filter: grayscale(1); }

/* ---------- app shell ---------- */
.app {
  height: 100%; box-sizing: border-box;
  display: grid; grid-template-rows: var(--hdr-h) auto auto minmax(0, 1fr);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-bottom: 36px;
}
#hdr { grid-row: 1; } #banner { grid-row: 2; } #specline { grid-row: 3; } #main { grid-row: 4; }
.hdr { display: flex; align-items: center; gap: 10px; min-width: 0; height: var(--hdr-h); }
.brand { display: flex; align-items: center; gap: 8px; flex: none; }
.brand img { display: block; width: 24px; height: 24px; }
.wordmark { font-size: 1.05rem; font-weight: 700; letter-spacing: var(--tracking-tight); }
.hdr-menu { min-height: 28px; padding: 2px 8px; }
.hdr-sep { width: 1px; height: 20px; background: var(--border); flex: none; }
.proj { font-weight: 600; font-size: 0.875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 180px; }
.hdr-title { font-weight: 600; font-size: 0.875rem; }
.set-chip .num { font-size: 0.75rem; display: inline-block; min-width: 7ch; text-align: right; }
.runchip-slot { width: 248px; flex: none; height: 32px; display: flex; align-items: center; }
.runchip {
  width: 100%; height: 30px; box-sizing: border-box; display: grid; grid-template-columns: 20px minmax(0, 1fr); grid-template-rows: 1fr 3px;
  column-gap: 6px; align-items: center; padding: 3px 10px 3px 8px; text-align: left;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); font-size: 0.75rem; font-weight: 500;
  transition: background-color 80ms ease, border-color 80ms ease;
}
.runchip:hover { background: var(--secondary); }
.runchip .ms { font-size: 16px; grid-row: 1 / 3; }
.runchip-txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.runchip-bar { grid-column: 2; height: 3px; border-radius: var(--radius-full); background: var(--secondary); overflow: hidden; }
.runchip-bar i { display: block; height: 100%; background: var(--primary); }
.runchip--idle { color: var(--muted-foreground); }
.runchip--attn { border-color: var(--primary); background: var(--peach-faint); }
.runchip--bad { border-color: var(--destructive); }
.hdr-spacer { flex: 1 1 auto; min-width: 0; }
.save { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; color: var(--muted-foreground); white-space: nowrap; }
.save--bad { color: var(--destructive); font-weight: 600; }
.agent-toggle {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 3px 10px; box-sizing: border-box; flex: none;
  border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--card); font-size: 12px; font-weight: 600;
  transition: background-color 80ms ease, border-color 80ms ease;
}
.agent-toggle:hover { background: var(--secondary); }
.agent-toggle .dot { width: 7px; height: 7px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid currentColor; }
.agent-toggle[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.agent-toggle[aria-pressed="true"] .dot { background: currentColor; }

.banner {
  display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 12px; margin-bottom: 8px; box-sizing: border-box;
  border: 1px solid var(--foreground); border-radius: var(--radius); background: var(--warning-soft); font-size: 0.8125rem; flex-wrap: wrap;
}
.banner b { font-weight: 600; }

/* spec line */
.specline {
  height: var(--spec-h); box-sizing: border-box; margin-bottom: 10px;
  display: flex; align-items: center; gap: 2px; padding: 0 4px 0 8px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
}
.spec-item { display: inline-flex; align-items: center; gap: 2px; flex: none; padding: 0 2px; }
.spec-item + .spec-item::before { content: ''; width: 1px; height: 16px; background: var(--border); margin-right: 8px; }
.spec-l { font-size: 0.75rem; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; }
.spec-v {
  display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 6px; box-sizing: border-box; flex: none;
  border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.8125rem;
  transition: background-color 80ms ease, border-color 80ms ease;
}
.spec-v:hover { background: var(--secondary); }
.spec-v .pdot { width: 6px; height: 6px; border-radius: 50%; background: transparent; flex: none; }
.spec-v.has-prop { border-color: var(--primary); background: var(--peach-faint); }
.spec-v.has-prop .pdot { background: var(--primary); }
.spec-v.locked { color: var(--muted-foreground); }
.spec-v .ms { font-size: 14px; }
.spec-v > span:last-child { min-width: 4ch; text-align: right; }
.spec-end { margin-left: auto; padding-left: 12px; flex: none; display: flex; align-items: center; gap: 8px; }

/* main */
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--pane-w); gap: 10px; }
.main.pane-off { grid-template-columns: minmax(0, 1fr); }
.center { min-height: 0; min-width: 0; display: grid; grid-template-rows: var(--proof-h) minmax(0, 1fr); gap: 10px; }
#proof { grid-row: 1; } #box { grid-row: 2; }

/* proof band */
.proof { min-height: 0; display: grid; grid-template-rows: 44px minmax(0, 1fr); overflow: hidden; }
.proof-head { display: flex; align-items: center; gap: 10px; padding: 0 8px 0 6px; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; border-bottom: 1px solid var(--border); }
.proof-head .tabs { padding: 3px; }
.proof-head .tab { min-height: 26px; padding: 2px 12px; font-size: 0.75rem; }
.proof-textslot { width: 240px; flex: none; }
.proof-textslot .input { width: 100%; height: 28px; font-family: var(--font-sans); }
.proof-info { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; font-size: 0.75rem; color: var(--muted-foreground); white-space: nowrap; }
.proof-body { min-height: 0; overflow: auto; padding: 6px 12px; position: relative; scrollbar-width: thin; }
.proof-svg { display: block; overflow: visible; }
.proof-svg .ink { fill: var(--ink); color: var(--ink); }
.proof-svg .ghost { fill: none; stroke: var(--ghost); stroke-width: 1; stroke-dasharray: 3 3; }
.proof-svg .hit { fill: transparent; cursor: pointer; }
.proof-svg .pg:hover .hit { fill: var(--peach-faint); }
.proof-svg .hl { fill: var(--peach-soft); }
.proof-svg .rowlabel { font-family: var(--font-mono); font-size: 10px; fill: var(--muted-foreground); }
.proof-svg .notdef { fill: none; stroke: var(--muted-foreground); stroke-width: 1; }
.proof-svg .prop { fill: var(--ink); color: var(--ink); stroke: var(--ink); }
.gate-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.gate-q { font-size: 0.8125rem; font-weight: 600; }
.gate-measure { font-size: 0.75rem; color: var(--muted-foreground); }
.follow-head { display: flex; align-items: center; gap: 12px; padding: 0 8px; min-width: 0; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); }
.space-row { display: flex; align-items: center; gap: 6px; margin-left: auto; flex: none; font-size: 0.75rem; }
.space-row label { color: var(--muted-foreground); }
.space-row .input { width: 64px; text-align: right; }

/* mobile run card (monitor mode) */
.runm { display: none; }

/* box: grid, editor and preflight share the same edges */
.box { min-height: 0; min-width: 0; position: relative; overflow: hidden; container-type: inline-size; container-name: box; }
.gridview, .editorview, .preflightview { position: absolute; inset: 0; display: grid; min-height: 0; }
.gridview { grid-template-rows: 48px minmax(0, 1fr) 52px; }
.grid-tools { display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--border); min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.filters { display: flex; gap: 4px; flex: none; padding: 4px 0; }
.filters .chip { height: 28px; padding: 0 8px; }
.filters .show-chip { width: 184px; }
.show-chip .show-l { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.group-switch { margin-left: auto; flex: none; }
.group-switch .sw { width: 26px; height: 16px; border-radius: var(--radius-full); background: var(--secondary); border: 1px solid var(--muted-foreground); position: relative; box-sizing: border-box; flex: none; }
.group-switch .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted-foreground); }
.group-switch[aria-pressed="true"] .sw { background: var(--primary-foreground); border-color: var(--primary-foreground); }
.group-switch[aria-pressed="true"] .sw::after { left: 12px; background: var(--primary); }
.grid-scroll { min-height: 0; overflow: auto; padding: 6px 12px 16px; scrollbar-width: thin; }
.grp { padding-top: 6px; }
.grp + .grp { margin-top: 10px; }
.grp-h { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 4px 0 4px; }
.grp-h h4 { font-size: 0.875rem; }
.grp-count { font-size: 0.75rem; color: var(--foreground); min-width: 9ch; }
.grp-sum { font-size: 0.75rem; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.grp-act { margin-left: auto; display: flex; align-items: center; gap: 4px; flex: none; }
.grp-slot { width: 148px; display: flex; justify-content: flex-end; }
.inline-confirm {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; margin: 4px 4px 8px;
  border: 1px solid var(--destructive); border-radius: var(--radius); background: var(--danger-soft); font-size: 0.8125rem;
}
.inline-confirm p { flex: 1 1 200px; font-size: 0.8125rem; line-height: 1.4; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, 84px); gap: 6px; padding: 4px; }
.cell {
  position: relative; width: 84px; height: 100px; box-sizing: border-box; padding: 0 0 4px; margin: 0;
  display: grid; grid-template-rows: 58px 18px 18px; justify-items: start; text-align: left;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--foreground);
  transition: background-color 80ms ease, border-color 80ms ease;
}
.cell:hover { background: var(--secondary); }
.cell[aria-selected="true"] { box-shadow: inset 0 0 0 2px var(--primary); }
.cell.is-open { border-color: var(--foreground); }
.cell svg { width: 82px; height: 58px; display: block; }
.cell .ink { fill: var(--ink); color: var(--ink); }
.cell .ghost { fill: none; stroke: var(--ghost); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.cell .draftpart { fill: url(#hatch); stroke: var(--primary); stroke-width: 1; vector-effect: non-scaling-stroke; }
.cell .prev { fill: var(--ink); opacity: 0.18; }
.cell .failpart { fill: url(#hatch-bad); stroke: var(--destructive); stroke-width: 1; vector-effect: non-scaling-stroke; }
.cell .wbar { fill: var(--peach-soft); stroke: var(--foreground); stroke-width: 1; vector-effect: non-scaling-stroke; }
.cell .wbar-empty { fill: none; stroke: var(--ghost); stroke-dasharray: 3 3; stroke-width: 1; vector-effect: non-scaling-stroke; }
.cell .notdef { fill: none; stroke: var(--ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.cell-row { display: flex; align-items: center; gap: 4px; width: 100%; padding: 0 5px; box-sizing: border-box; min-width: 0; }
.cell-ch { font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cell-tag { margin-left: auto; color: var(--muted-foreground); display: inline-flex; }
.cell-tag .ms { font-size: 14px; }
.cells-more { display: flex; align-items: center; gap: 10px; padding: 12px 4px 4px; font-size: 0.8125rem; color: var(--muted-foreground); }
.filter-hint { padding: 6px 4px; font-size: 0.8125rem; color: var(--muted-foreground); display: flex; align-items: center; gap: 8px; }
.selbar { display: flex; align-items: center; gap: 10px; padding: 0 10px; border-top: 1px solid var(--border); min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.selbar-glyph { width: 36px; height: 36px; flex: none; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); }
.selbar-glyph svg { width: 34px; height: 34px; display: block; }
.selbar-glyph .ink { fill: var(--ink); color: var(--ink); }
.selbar-glyph .ghost { fill: none; stroke: var(--ghost); stroke-dasharray: 3 3; stroke-width: 1; vector-effect: non-scaling-stroke; }
.selbar-info { min-width: 0; flex: 1 1 auto; display: grid; line-height: 1.25; }
.selbar-info b { font-size: 0.8125rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.selbar-info span { font-size: 0.75rem; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.selbar-acts { display: flex; gap: 6px; flex: none; }
.msg-slot { font-size: 0.75rem; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* glyph surfaces shared by small renders */
.selbar-glyph .draftpart, .rcpt-g .draftpart { fill: url(#hatch); stroke: var(--primary); stroke-width: 1; vector-effect: non-scaling-stroke; }
.selbar-glyph .failpart, .rcpt-g .failpart { fill: url(#hatch-bad); stroke: var(--destructive); stroke-width: 1; vector-effect: non-scaling-stroke; }
.selbar-glyph .prev, .rcpt-g .prev { fill: var(--ink); opacity: 0.18; }
.selbar-glyph .wbar, .rcpt-g .wbar { fill: var(--peach-soft); stroke: var(--foreground); stroke-width: 1; vector-effect: non-scaling-stroke; }
.selbar-glyph .wbar-empty, .rcpt-g .wbar-empty { fill: none; stroke: var(--ghost); stroke-dasharray: 3 3; stroke-width: 1; vector-effect: non-scaling-stroke; }
.selbar-glyph .notdef, .rcpt-g .notdef { fill: none; stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; }
.mini-proof .hit { fill: transparent; }
.mini-proof .hl { fill: none; }

/* editor in place */
.editorview { grid-template-rows: 48px minmax(0, 1fr); }
.ed-head { display: flex; align-items: center; gap: 8px; padding: 0 8px; border-bottom: 1px solid var(--border); min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.ed-glyph { display: flex; align-items: baseline; gap: 6px; min-width: 0; flex: none; }
.ed-glyph b { font-size: 1.25rem; font-weight: 700; min-width: 1ch; }
.ed-glyph span { font-size: 0.75rem; color: var(--muted-foreground); white-space: nowrap; }
.owner { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; box-sizing: border-box; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 600; white-space: nowrap; border: 1px solid var(--border); flex: none; }
.owner--you { background: var(--secondary); border-color: var(--foreground); }
.owner--agent { background: var(--peach-soft); border-color: var(--primary); }
.owner--ro { color: var(--muted-foreground); border-style: dashed; }
.ed-sp { flex: 1 1 auto; min-width: 8px; }
.ed-acts { display: flex; align-items: center; gap: 6px; flex: none; }
.ed-body { min-height: 0; display: grid; grid-template-columns: 48px minmax(0, 1fr) 216px; }
.ed-body.insp-off { grid-template-columns: 48px minmax(0, 1fr) 44px; }
.ed-rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-right: 1px solid var(--border); overflow-y: auto; overflow-x: hidden; }
.ed-rail .gap20 { height: 20px; flex: none; }
.tool {
  width: 32px; height: 32px; flex: none; display: grid; place-items: center; padding: 0; box-sizing: border-box;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--foreground);
  transition: background-color 80ms ease, border-color 80ms ease, color 80ms ease;
}
.tool:hover { background: var(--secondary); }
.tool[aria-pressed="true"] { background: var(--primary); border-color: var(--primary-foreground); color: var(--primary-foreground); }
.tool[aria-disabled="true"] { background: var(--muted); color: var(--muted-foreground); cursor: not-allowed; }
.ed-canvas-wrap { position: relative; min-width: 0; min-height: 0; padding: 8px; box-sizing: border-box; }
.ed-canvas { position: absolute; inset: 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--canvas); box-shadow: var(--shadow-xs); overflow: hidden; }
.ed-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.ed-svg.t-edit, .ed-svg.t-resize { cursor: default; }
.ed-svg.panning, .ed-svg.space { cursor: grab; }
.ed-svg.ro { cursor: not-allowed; }
.ed-svg:focus-visible { outline-offset: -3px; } /* the canvas clips overflow, so the ring sits inside it */
.ed-svg .guide { stroke: var(--canvas-guide); stroke-width: 1; shape-rendering: crispEdges; }
.ed-svg .guide--base { stroke: var(--canvas-guide-strong); }
.ed-svg .guide--adv { stroke: var(--canvas-guide-strong); stroke-dasharray: 4 4; }
.ed-svg .guide-l { font-family: var(--font-mono); font-size: 10px; fill: oklch(0.5931 0.0295 44.5478); }
.ed-svg .gfill { fill: var(--canvas-ink); fill-opacity: 0.92; }
.ed-svg .gline { fill: none; stroke: var(--canvas-ink); stroke-width: 1; }
.ed-svg .gdraft { fill: url(#hatch-ed); stroke: oklch(0.6 0.13 58); stroke-width: 1; }
.ed-svg .gfail { fill: url(#hatch-bad-ed); stroke: oklch(0.6137 0.2039 25.5645); stroke-width: 1; }
.ed-svg .before { fill: none; stroke: oklch(0.6 0.13 58); stroke-width: 1.5; stroke-dasharray: 5 4; }
.ed-svg .hitc { fill: transparent; stroke: none; }
.ed-svg .handle-l { stroke: oklch(0.6 0.05 50); stroke-width: 1; }
.ed-svg .handle { fill: oklch(1 0 0); stroke: oklch(0.45 0.06 50); stroke-width: 1; }
.ed-svg .pt { fill: oklch(1 0 0); stroke: oklch(0.2707 0.054 44.1725); stroke-width: 1.25; }
.ed-svg .pt.sel { fill: oklch(0.8141 0.1261 58.1544); }
.ed-svg .pt.first { stroke-width: 2; }
.ed-svg .pt.near { fill: oklch(0.8141 0.1261 58.1544); }
.ed-svg .rubber { fill: none; stroke: oklch(0.6 0.13 58); stroke-width: 1; stroke-dasharray: 4 3; }
.ed-svg .bbox { fill: none; stroke: oklch(0.6 0.13 58); stroke-width: 1; stroke-dasharray: 3 3; }
.ed-svg .ed-label { font-family: var(--font-mono); font-size: 11px; fill: oklch(0.5931 0.0295 44.5478); }
.done-pill {
  position: absolute; top: 20px; right: 20px; height: 30px; padding: 0 14px; border: 1px solid var(--primary); border-radius: var(--radius-full);
  background: var(--primary); color: var(--primary-foreground); font-size: 0.75rem; font-weight: 600; z-index: 3;
  transition: background-color 80ms ease;
}
.done-pill:hover { background: var(--primary-hover); }
.ed-banner {
  position: absolute; top: 16px; left: 16px; right: 16px; z-index: 4; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  min-height: 40px; padding: 4px 6px 4px 12px; box-sizing: border-box; border-radius: var(--radius); border: 1px solid var(--primary);
  background: var(--card); box-shadow: var(--shadow-sm); font-size: 0.8125rem;
}
.ed-banner .ms { color: var(--foreground); }
.ed-banner b { font-weight: 600; }
.ed-banner .sp { flex: 1 1 auto; }
.ed-banner--warn { border-color: var(--destructive); }
.ed-hint { position: absolute; left: 20px; bottom: 18px; z-index: 2; font-size: 0.75rem; color: oklch(0.5931 0.0295 44.5478); background: oklch(1 0 0 / 0.9); padding: 4px 8px; border-radius: var(--radius-sm); max-width: calc(100% - 330px); }
.ed-hint--msg { color: var(--canvas-ink); font-weight: 500; }
.zoom-cluster { position: absolute; right: 23px; bottom: 22px; z-index: 3; display: flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow-sm); }
.zoom-cluster .icon-btn { width: 30px; height: 30px; }
.zoom-cluster .wide-only { display: contents; }
.zoom-read { width: 6em; height: 30px; display: grid; place-items: center; font-size: 0.75rem; }
.ed-insp { border-left: 1px solid var(--border); overflow-y: auto; overflow-x: hidden; padding: 6px 8px 12px; min-width: 0; scrollbar-width: thin; }
.insp-off .ed-insp { padding: 6px 5px; }
.insp-sec + .insp-sec { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.insp-sec h5 { margin: 0 0 6px; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted-foreground); }
.insp-grid { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: 5px 8px; align-items: center; font-size: 0.75rem; }
.insp-grid .input { width: 72px; text-align: right; }
.insp-line { font-size: 0.75rem; line-height: 1.45; display: flex; gap: 6px; align-items: flex-start; }
.insp-line + .insp-line { margin-top: 4px; }
.insp-line .ms { font-size: 16px; }
.insp-toggle { display: flex; justify-content: flex-end; }

/* preflight */
.preflightview { grid-template-rows: 48px minmax(0, 1fr); }
.pf-head { display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--border); min-width: 0; }
.pf-head h4 { flex: none; white-space: nowrap; }
.pf-head .msg-slot { flex: 1 1 auto; font-size: 12px; } /* one slot: the subtitle, or the latest message */
.pf-head .msg-slot.is-msg { color: var(--foreground); font-weight: 500; }
.pf-body { overflow: auto; padding: 14px 16px 20px; display: grid; gap: 16px; align-content: start; scrollbar-width: thin; }
.pf-cov { display: grid; gap: 6px; }
.bar { height: 6px; border-radius: var(--radius-full); background: var(--secondary); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.pf-missing { display: grid; gap: 8px; }
.pf-grp { display: flex; align-items: flex-start; gap: 10px; }
.pf-grp > span { width: 110px; flex: none; font-size: 0.75rem; color: var(--muted-foreground); padding-top: 6px; }
.pf-chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px; }
.gchip { min-width: 32px; height: 32px; padding: 0 6px; box-sizing: border-box; border: 1px dashed var(--ghost); border-radius: var(--radius-sm); background: var(--card); font-size: 0.875rem; transition: background-color 80ms ease; }
.gchip:hover { background: var(--secondary); }
.pf-checks { display: grid; gap: 6px; }
.pf-check { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 40px; padding: 4px 8px; border: 1px solid var(--border); border-radius: var(--radius); }
.pf-check .ms { font-size: 18px; }
.pf-check p { font-size: 0.8125rem; line-height: 1.4; }
.pf-foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ok { color: var(--success); } .bad { color: var(--destructive); } .warn { color: var(--foreground); }

/* agent pane */
.pane { min-height: 0; min-width: 0; display: grid; grid-template-rows: 48px auto auto minmax(0, 1fr) auto; overflow: hidden; border-radius: 12px; }
.pane-h { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--border); min-width: 0; }
.pane-h h4 { font-size: 0.9375rem; }
.model-chip { display: inline-flex; align-items: center; gap: 6px; min-width: 0; height: 28px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); font-size: 0.75rem; white-space: nowrap; overflow: hidden; transition: background-color 80ms ease; }
button.model-chip:hover { background: var(--secondary); }
.model-chip .ok-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex: none; }
.model-chip .no-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted-foreground); box-sizing: border-box; flex: none; }
.pane-banner { margin: 8px 10px 0; padding: 8px 10px; border: 1px solid var(--foreground); border-radius: var(--radius); background: var(--warning-soft); font-size: 0.8125rem; display: grid; gap: 6px; }
.pane-banner .row { display: flex; gap: 6px; flex-wrap: wrap; }
.runcard { margin: 8px 10px 0; padding: 6px 6px 6px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); display: grid; gap: 4px; }
.rc-line { display: flex; align-items: center; gap: 8px; min-height: 32px; min-width: 0; }
.rc-ico { width: 20px; flex: none; display: grid; place-items: center; }
.rc-txt { min-width: 0; flex: 1 1 auto; display: grid; line-height: 1.25; }
.rc-txt b { font-size: 0.8125rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-txt span { font-size: 0.6875rem; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-ctrl { display: flex; align-items: center; flex: none; }
.rc-ctrl .gap { width: 14px; flex: none; }
.rc-ctrl .vsep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; flex: none; }
.rc-row2 { display: flex; align-items: center; gap: 10px; min-height: 32px; padding-left: 28px; min-width: 0; }
.rc-bar { flex: 1 1 auto; min-width: 24px; height: 4px; border-radius: var(--radius-full); background: var(--secondary); overflow: hidden; }
.rc-bar i { display: block; height: 100%; background: var(--primary); }
.rc-meta { display: flex; align-items: center; gap: 8px; min-height: 24px; padding-left: 28px; font-size: 0.6875rem; color: var(--muted-foreground); }
.rc-meta .btn { min-height: 24px; padding: 0 6px; font-size: 0.6875rem; }
.rc-details { padding: 8px 4px 4px 28px; display: grid; gap: 8px; font-size: 0.75rem; border-top: 1px solid var(--border); }
.rc-details .kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.cp-row { display: flex; align-items: center; gap: 6px; min-height: 28px; }
.cp-row .ms { font-size: 16px; color: var(--muted-foreground); }
.cp-row span { flex: 1 1 auto; min-width: 0; }
.plan { margin: 8px 10px 0; border: 1px solid var(--border); border-radius: var(--radius); }
.plan-line { width: 100%; display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 8px 0 10px; box-sizing: border-box; border: 0; background: transparent; text-align: left; border-radius: var(--radius); font-size: 0.8125rem; transition: background-color 80ms ease; }
.plan-line:hover { background: var(--secondary); }
.plan-line b { font-weight: 600; }
.plan-line .txt { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan-body { padding: 4px 10px 10px; display: grid; gap: 8px; border-top: 1px solid var(--border); scrollbar-width: thin; }
.step { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 2px 6px; font-size: 0.8125rem; }
.step .ms { font-size: 18px; }
.step.off .step-t { text-decoration: line-through; color: var(--muted-foreground); }
.step-t { font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.step-chips { grid-column: 2; display: flex; flex-wrap: wrap; gap: 3px; padding: 2px; }
.pchip { min-width: 26px; height: 26px; padding: 0 5px; box-sizing: border-box; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); font-size: 0.8125rem; transition: background-color 80ms ease; }
.pchip:hover { background: var(--secondary); }
.pchip.held { text-decoration: line-through; color: var(--muted-foreground); border-style: dashed; }
.pchip.mine { border-color: var(--foreground); background: var(--secondary); }
.pchip.ctrl { border-color: var(--primary); }
.step-arrow { color: var(--muted-foreground); font-size: 0.75rem; align-self: center; padding: 0 2px; }
.est { display: grid; gap: 6px; padding: 8px; border-radius: var(--radius); background: var(--secondary); font-size: 0.75rem; }
.est-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.est-row .input { width: 72px; }
.pane-scroll { min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
.thread { padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.5; scrollbar-width: thin; }
.t-user-wrap { align-self: flex-end; max-width: 85%; }
.t-user { max-width: 100%; background: var(--secondary); border-radius: 8px; padding: 6px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.t-agent { max-width: 100%; overflow-wrap: anywhere; }
.t-agent .who, .t-sys .who { font-size: 0.6875rem; color: var(--muted-foreground); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-bottom: 2px; }
.t-sys { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted-foreground); }
.t-sys .ms { font-size: 14px; }
.t-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; background: var(--card); }
.t-card--peach { border-color: var(--primary); }
.t-card--bad { border-color: var(--destructive); }
.t-card h5 { margin: 0; font-size: 0.8125rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.t-card .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.t-card .acts--fill { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
.quote { border-left: 2px solid var(--border); padding-left: 8px; color: var(--muted-foreground); font-style: italic; }
.rcpt-group { display: grid; gap: 4px; }
.rcpt-head { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted-foreground); padding: 2px 0; }
.rcpt { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 40px; padding: 4px 4px 4px 4px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
.rcpt-g { width: 28px; height: 28px; border-radius: 4px; background: var(--secondary); }
.rcpt-g svg { width: 28px; height: 28px; display: block; }
.rcpt-g .ink { fill: var(--ink); color: var(--ink); }
.rcpt-g .ghost { fill: none; stroke: var(--ghost); stroke-dasharray: 2 2; stroke-width: 1; vector-effect: non-scaling-stroke; }
.rcpt-t { min-width: 0; display: grid; line-height: 1.3; }
.rcpt-t b { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rcpt-t span { font-size: 11px; color: var(--muted-foreground); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.rcpt-a { display: flex; align-items: center; gap: 4px; }
.rcpt-a .btn { min-height: 28px; padding: 0 8px; font-size: 0.75rem; }

.comp-top { display: flex; align-items: center; gap: 6px; min-height: 28px; flex-wrap: wrap; }
.scope-chip { height: 26px; font-size: 0.75rem; padding: 0 6px 0 8px; }
.img-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 2px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.75rem; background: var(--card); }

.newfont { grid-row: 3 / 5; min-height: 0; overflow: auto; padding: 8px 4px 24px; }

.sets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 2px; }
.set-opt { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; align-content: start; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: background-color 80ms ease, border-color 80ms ease; }

/* popovers & menus */
.layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
.pop {

/* prototype chrome (not part of the app) */
.proto-btn {
  position: fixed; left: max(8px, env(safe-area-inset-left, 0px)); bottom: max(6px, env(safe-area-inset-bottom, 0px)); z-index: 80;

.proto-menu .pm-row button:hover { background: var(--secondary); }

.proto-menu .foot { margin: 8px 6px 2px; color: var(--muted-foreground); line-height: 1.45; font-size: 10.5px; }

/* ---------- width tiers ---------- */
@media (max-width: 1099px) {
  .main, .main.pane-off { grid-template-columns: minmax(0, 1fr); }
  .pane {
    position: fixed; z-index: 50; top: calc(var(--hdr-h) + var(--spec-h) + 10px + env(safe-area-inset-top, 0px)); right: var(--gutter-r); bottom: 36px;
    width: min(450px, calc(100vw - 32px)); box-shadow: var(--shadow-pane);

  .runchip-slot { width: auto; flex: 0 1 210px; min-width: 0; } /* fixed basis: the chip never resizes with its text */
  .hide-narrow, .gate-q, .selbar-glyph { display: none; }
  /* the tool row wraps to two fixed lines so the punctuation switch stays on screen */
  .gridview { grid-template-rows: auto minmax(0, 1fr) 52px; }
  .grid-tools { flex-wrap: wrap; row-gap: 6px; padding: 8px 10px; overflow: visible; }
  .group-switch { margin-left: 0; }
  .set-chip .set-name { display: none; }
  .center { grid-template-rows: var(--proof-h) auto minmax(0, 1fr); }
  .runm { display: block; grid-row: 2; }
  #box { grid-row: 3; }
  .runm .runcard { margin: 0; border: 0; }
  .pane {
    top: auto; left: var(--gutter-l); right: var(--gutter-r); bottom: 0; width: auto; height: min(78dvh, 640px);
    border-radius: 12px 12px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .pane .runcard { display: none; }
  .sets, .starts { grid-template-columns: minmax(0, 1fr); }
  .start { min-height: 0; }
  .nf { padding: 16px 4px; }
  .proof-textslot { width: 160px; }
  .ed-body, .ed-body.insp-off { grid-template-columns: minmax(0, 1fr); }
  .ed-rail, .ed-insp { display: none; }

}
@container box (max-width: 920px) {
